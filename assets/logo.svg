<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" role="img"
     aria-label="USB Doctor: diagnose, repair and recover removable storage">
  <title>USB Doctor</title>
  <desc>A shield containing a USB plug with an ECG heartbeat trace, and a
  green status dot.</desc>

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2b3b"/>
      <stop offset="100%" stop-color="#16202c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cc0ff"/>
      <stop offset="100%" stop-color="#4ea1ff"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ea1ff"/>
      <stop offset="60%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="97.3" fill="#0f1620"/>

  <path d="M 141.7 61.4 L 370.3 61.4 Q 414.7 61.4 414.7 105.9 L 414.7 178.2 C 414.7 294.9 319.5 411.6 256.0 450.6 C 192.5 411.6 97.3 294.9 97.3 178.2 L 97.3 105.9 Q 97.3 61.4 141.7 61.4 Z"
        fill="url(#shell)" stroke="url(#accent)"
        stroke-width="10.2" stroke-linejoin="round"/>

  <rect x="237.6" y="260.6" width="36.8" height="34.5" rx="8.0" fill="#0d141c" stroke="#4ea1ff" stroke-width="5.8"/><rect x="169.8" y="150.2" width="172.5" height="110.4" rx="11.5" fill="#0d141c" stroke="#4ea1ff" stroke-width="8.0"/><rect x="187.0" y="172.3" width="29.3" height="17.7" rx="3.4" fill="#4ea1ff" fill-opacity="0.90"/><rect x="223.2" y="172.3" width="29.3" height="17.7" rx="3.4" fill="#4ea1ff" fill-opacity="0.77"/><rect x="259.4" y="172.3" width="29.3" height="17.7" rx="3.4" fill="#4ea1ff" fill-opacity="0.64"/><rect x="295.7" y="172.3" width="29.3" height="17.7" rx="3.4" fill="#4ea1ff" fill-opacity="0.51"/>

  <path d="M 197.3 333.8 L 223.1 333.8 L 232.5 320.2 L 243.1 355.2 L 254.8 294.9 L 266.6 333.8 L 286.5 333.8 L 314.7 333.8" fill="none" stroke="url(#pulse)"
        stroke-width="10.2" stroke-linecap="round"
        stroke-linejoin="round" filter="url(#glow)"/>

  <circle cx="351.2" cy="170.4" r="15.4"
          fill="#3fb950" opacity="0.95"/>
</svg>
