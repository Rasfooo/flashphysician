<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img"
     aria-label="USB Doctor: diagnose, repair and recover removable storage">
  <title>USB Doctor</title>
  <desc>A shield containing a USB plug with an ECG heartbeat trace, and a
  green status dot.</desc>

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2b3b"/>
      <stop offset="100%" stop-color="#16202c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cc0ff"/>
      <stop offset="100%" stop-color="#4ea1ff"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ea1ff"/>
      <stop offset="60%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="12.2" fill="#0f1620"/>

  <path d="M 17.7 7.7 L 46.3 7.7 Q 51.8 7.7 51.8 13.2 L 51.8 22.3 C 51.8 36.9 39.9 51.5 32.0 56.3 C 24.1 51.5 12.2 36.9 12.2 22.3 L 12.2 13.2 Q 12.2 7.7 17.7 7.7 Z"
        fill="url(#shell)" stroke="url(#accent)"
        stroke-width="1.3" stroke-linejoin="round"/>

  <rect x="29.7" y="32.6" width="4.6" height="4.3" rx="1.0" fill="#0d141c" stroke="#4ea1ff" stroke-width="0.7"/><rect x="21.2" y="18.8" width="21.6" height="13.8" rx="1.4" fill="#0d141c" stroke="#4ea1ff" stroke-width="1.0"/><rect x="23.4" y="21.5" width="3.7" height="2.2" rx="0.4" fill="#4ea1ff" fill-opacity="0.90"/><rect x="27.9" y="21.5" width="3.7" height="2.2" rx="0.4" fill="#4ea1ff" fill-opacity="0.77"/><rect x="32.4" y="21.5" width="3.7" height="2.2" rx="0.4" fill="#4ea1ff" fill-opacity="0.64"/><rect x="37.0" y="21.5" width="3.7" height="2.2" rx="0.4" fill="#4ea1ff" fill-opacity="0.51"/>

  <path d="M 24.7 41.7 L 27.9 41.7 L 29.1 40.0 L 30.4 44.4 L 31.9 36.9 L 33.3 41.7 L 35.8 41.7 L 39.3 41.7" fill="none" stroke="url(#pulse)"
        stroke-width="1.3" stroke-linecap="round"
        stroke-linejoin="round" filter="url(#glow)"/>

  <circle cx="43.9" cy="21.3" r="1.9"
          fill="#3fb950" opacity="0.95"/>
</svg>
